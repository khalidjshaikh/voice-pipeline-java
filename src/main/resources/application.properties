# OpenAI
openai.apiKey=${OPENAI_API_KEY}
openai.baseUrl=https://api.openai.com/v1
openai.asrModel=whisper-1
openai.llmModel=gpt-4o-mini
openai.ttsModel=tts-1
openai.ttsVoice=alloy

# Audio capture
audio.sampleRate=16000
audio.frameMs=20

# VAD
vad.speechOnsetFrames=3
vad.silenceHangoverFrames=15
vad.minUtteranceMs=300
vad.noiseMultiplier=3.0
vad.absoluteFloor=500.0
vad.muteDuringPlayback=true
vad.bargeInMultiplier=4.0

# Queues
queue.asrCapacity=2
queue.llmCapacity=2
queue.ttsCapacity=4
queue.audioCapacity=8

# Conversation
conversation.maxTurns=10

# Playback
playback.sampleRate=24000
